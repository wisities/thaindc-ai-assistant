<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThaiNDC AI Learning Assistant</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><style>
:root{font-family:'Segoe UI',Tahoma,sans-serif;color:#17263c;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:730px;margin:auto}h1{font-size:20px;margin:5px 0}h2{font-size:15px}small,.muted{color:#64748b}section{background:#fff;padding:16px;margin:12px 0;border-radius:12px;border:1px solid #e3e9f1}label{font-size:12px;font-weight:600;display:block;margin:12px 0 4px}input,textarea,select{width:100%;font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:9px;background:white}input[type=file]{font-size:12px}button{border:0;border-radius:8px;background:#1765cb;color:white;padding:11px 14px;cursor:pointer;font-weight:600}button.secondary{background:#eaf1fa;color:#13539f}button:disabled{opacity:.55}button+button{margin-left:6px}#status{white-space:pre-wrap;font-size:12px;color:#3c5978}#brief{max-height:430px;overflow:auto;line-height:1.5;font-size:13px;background:#f8fafc;padding:12px;border:1px solid #e2e8f0;border-radius:8px}#brief table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0}#brief td{border:1px solid #cbd5e1;padding:4px 6px}#brief h1{font-size:14px;font-weight:700;margin:12px 0 4px;color:#0f2942}#brief ul{margin:4px 0 8px;padding-left:18px}#brief li,#brief p{font-size:12.5px;margin:2px 0}#history{width:100%}.footer{font-size:11px;color:#64748b}
</style></head><body><h1>📘 ThaiNDC AI Learning Assistant</h1><small>ผู้ช่วยสรุปบทเรียนสำหรับผู้บริหาร วปอ. · Word Add-in MVP</small><section><h2>บันทึกการเรียนประจำวัน</h2><form id="lectureForm"><label>วันที่เรียน</label><input required type="date" name="date" id="date"><label>หัวข้อการบรรยาย</label><input required name="title" placeholder="เช่น ยุทธศาสตร์ความมั่นคง"><label>ชื่อวิทยากร</label><input name="lecturer" placeholder="ชื่อ–นามสกุล / ตำแหน่ง"><label>สไลด์ PDF / PowerPoint / TXT (เพิ่มได้หลายไฟล์)</label><input name="slides" type="file" multiple accept=".pdf,.pptx,.txt"><label>เสียง MP3 / M4A / WAV / WEBM (เพิ่มได้หลายไฟล์, ไม่เกิน 25 MB ต่อไฟล์)</label><input name="audio" type="file" multiple accept=".mp3,.mp4,.mpeg,.mpga,.m4a,.wav,.webm"><label>บันทึกเพิ่มเติม</label><textarea rows="3" name="notes" placeholder="จดประเด็นสำคัญ คำถาม หรือข้อสังเกต..."></textarea><p><button type="submit">บันทึกและถอดเสียง</button></p></form><div id="status" role="status"></div></section><section><h2>คลังการบรรยาย</h2><select id="history"><option value="">เลือกรายการ...</option></select><p><button id="summarize">✨ สร้าง Executive Brief</button><button class="secondary" id="insert">แทรกลง Word</button><button class="secondary" id="copyBtn">📋 คัดลอกสรุป</button></p><div id="brief">เลือกการบรรยายเพื่อดูเอกสารสรุป</div></section><p class="footer">ข้อมูลจัดเก็บบนเซิร์ฟเวอร์ต้นแบบใน SQLite · ต้องได้รับอนุญาตก่อนอัปโหลด/ถอดเสียงบรรยาย</p><script src="/static/app.js"></script></body></html>
